[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "indeces-memory-manager"
version = "0.15.1.dev2026100704"
description = "A single Discord headless runtime with governed Hebbian memory and audited model calls"
requires-python = ">=3.12"
dependencies = ["discord.py==2.7.1", "pypdf==6.19.0"]

[project.scripts]
indeces = "indeces.console:main"
indeces-manual = "indeces.manual_trial.__main__:main"

[tool.setuptools.packages.find]
include = ["indeces*"]

[tool.setuptools.package-data]
indeces = ["web/*.html", "web/*.css", "web/*.js"]
