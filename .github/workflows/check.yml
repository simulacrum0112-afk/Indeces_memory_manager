name: Offline checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            python: ./.venv/Scripts/python.exe
          - os: ubuntu-latest
            python: ./.venv/bin/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m venv .venv
      - run: ${{ matrix.python }} -m pip install -r requirements.lock
      - run: ${{ matrix.python }} -m pip install --no-deps -e .
      - run: ${{ matrix.python }} -m unittest discover -s tests -v
      - run: ${{ matrix.python }} -m indeces check
